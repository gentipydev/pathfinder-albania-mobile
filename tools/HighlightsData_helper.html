        <input type="button" onclick="run();" value="RUN">

        <textarea id="output" rows="15" cols="80">Output here.</textarea>
        <script>
let destinations, destinationIndex, artifactIndex;
function run() {
    let destinationStrs = input.value.split('\n\n');
    destinations = [];
    for (let i=0; i<destinationStrs.length; i++) {
        let o = destinations[i] = {};
        let lineStrs = destinationStrs[i].split('\n');
        parseInfo(lineStrs[0], o);
        parseArtifacts(lineStrs.slice(1), o);
    }
    destinationIndex = artifactIndex = 0;
    loadNext();
}

function parseInfo(str, o) {
    if (str.trim().length < 1) { return; }
    let values = str.split(",");
    o.type = values[0].trim();
}

function parseArtifacts(strs, o) {
    let artifacts = [];
    for (let i=0; i<strs.length; i++) {
        artifacts.push({id: strs[i].replace(',','')});
    }
    o.artifacts = artifacts;
}

function loadNext() {
    if (destinationIndex >= destinations.length) { return out(); }
    let destination = destinations[destinationIndex], artifacts = destination.artifacts;
    if (artifactIndex >= artifacts.length) {
        destinationIndex++;
        artifactIndex = 0;
        return loadNext();
    }
    output.value = `Loading data for ${destination.type} artifact #${artifactIndex}`;
    let id = artifacts[artifactIndex].id;
    fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${id}`)
        .then(response => validateResponse(response));
}

function validateResponse(response) {
    response.json().then(data => parseArtifactData(data));
}

function parseArtifactData(data) {
    let destination = destinations[destinationIndex], o = destination.artifacts[artifactIndex];
    destination.artifacts[artifactIndex].data = data;
    console.log(data);
    artifactIndex++;
    loadNext();
}

let icons = ['silhouette', 'foo'];
function out() {
    // other possibly useful props: objectDate, culture, primaryImage, primaryImageSmall
    let str = '', iconIndex = 0;
    for (let i=0; i<destinations.length; i++) {
        let destination = destinations[i], artifacts = destination.artifacts;
        str += `// ${destination.type}\n`;
        for (let j=0; j<artifacts.length; j++) {
            let o = artifacts[j];
            str += 
`HighlightsData(
  title: '${escape(o.data.title)}',
  destination: DestinationType.${destination.type},
  artifactId: '${o.data.objectID}',
  culture: '${o.data.culture}',
  imageUrlSmall: '${o.data.primaryImageSmall}',
  imageUrl: '${o.data.primaryImage}',
  date: '${o.data.objectDate}',
),\n`;
        }
        str += "\n";
    }
    output.value = str;
}

function escape(str) {
    return str.replace(/'/g, '\\\'');
}
        </script>
