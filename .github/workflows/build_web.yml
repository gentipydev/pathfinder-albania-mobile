name: Build Flutter Web

on:
  workflow_dispatch:
    inputs:
      wasm:
        description: Build using WebAssembly
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      wasm:
        description: Build using WebAssembly
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.2'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Enable Flutter web
      run: flutter config --enable-web

    - name: Materialize .env
      # `.env` is a bundled asset the app loads at startup. Its only key is the
      # Mapbox token, left empty here: mapbox_maps_flutter is iOS/Android only,
      # so every map surface renders its unsupported-platform fallback on web.
      # All other content ships inside the app (assets/backend_snapshot/).
      run: |
        cat > .env <<EOF
        MAPBOX_ACCESS_TOKEN=
        EOF

    - name: Build Flutter web app - with WASM
      if: ${{ inputs.wasm }}
      run: flutter build web --wasm

    - name: Build Flutter web app - no WASM
      if: ${{ !inputs.wasm }}
      run: flutter build web --no-wasm-dry-run

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web
        # assets/.env is a dotfile; upload-artifact >=4.4 drops hidden files by default
        include-hidden-files: true
        retention-days: 1  # Adjust as needed
