name: Mobile CI

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/mobile-ci.yml'

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the same version the deploy workflows use so analyze
          # and test run on the exact toolchain that ships.
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Materialize dummy .env
        # `.env` is a bundled asset read by lib/config/env.dart; the only key
        # is the Mapbox token, which no test exercises.
        run: |
          cat > .env <<'EOF'
          MAPBOX_ACCESS_TOKEN=pk.test-placeholder
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        # `--fatal-infos` treats info-level lints as failures; matches the
        # bar set in analysis_options.yaml's custom rules.
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter compact
